<svg width="980" height="560" viewBox="0 0 980 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Package hallucination detection screenshot</title>
  <desc id="desc">Terminal-style screenshot showing real and hallucinated npm package detection.</desc>
  <rect width="980" height="560" rx="18" fill="#0B1020"/>
  <rect x="24" y="24" width="932" height="512" rx="14" fill="#111827" stroke="#334155"/>
  <circle cx="54" cy="54" r="8" fill="#EF4444"/>
  <circle cx="80" cy="54" r="8" fill="#F59E0B"/>
  <circle cx="106" cy="54" r="8" fill="#22C55E"/>
  <text x="134" y="61" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">scan-packages</text>
  <text x="48" y="112" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">$ npx agent-security-scanner-mcp scan-packages ./src/app.ts npm --verbosity compact</text>
  <rect x="48" y="150" width="860" height="76" rx="10" fill="#1E293B" stroke="#475569"/>
  <text x="74" y="181" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="700">4 packages found</text>
  <text x="74" y="209" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">2 legitimate, 2 potentially hallucinated</text>
  <rect x="48" y="270" width="410" height="176" rx="10" fill="#052E16" stroke="#22C55E"/>
  <text x="74" y="304" fill="#86EFAC" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="700">Legitimate</text>
  <text x="74" y="344" fill="#DCFCE7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">express</text>
  <text x="74" y="382" fill="#DCFCE7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">zod</text>
  <rect x="498" y="270" width="410" height="176" rx="10" fill="#450A0A" stroke="#EF4444"/>
  <text x="524" y="304" fill="#FCA5A5" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="700">Potentially hallucinated</text>
  <text x="524" y="344" fill="#FEE2E2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">secure-mcp-session-bridge</text>
  <text x="524" y="382" fill="#FEE2E2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">agent-memory-graph-cache</text>
  <text x="48" y="500" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui" font-size="16">Use before installing AI-suggested dependencies or merging generated imports.</text>
</svg>
