<svg width="980" height="560" viewBox="0 0 980 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MCP server audit screenshot</title>
  <desc id="desc">Terminal-style screenshot showing MCP server audit findings.</desc>
  <rect width="980" height="560" rx="18" fill="#0B1020"/>
  <rect x="24" y="24" width="932" height="512" rx="14" fill="#111827" stroke="#334155"/>
  <circle cx="54" cy="54" r="8" fill="#EF4444"/>
  <circle cx="80" cy="54" r="8" fill="#F59E0B"/>
  <circle cx="106" cy="54" r="8" fill="#22C55E"/>
  <text x="134" y="61" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">scan-mcp</text>
  <text x="48" y="112" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">$ npx agent-security-scanner-mcp scan-mcp ./mcp-server --verbosity compact</text>
  <rect x="48" y="146" width="860" height="78" rx="10" fill="#450A0A" stroke="#EF4444"/>
  <text x="74" y="179" fill="#FCA5A5" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="700">Grade F: do not install until fixed</text>
  <text x="74" y="207" fill="#FEE2E2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">8 findings across command execution, tool poisoning, name spoofing, env exposure</text>
  <text x="48" y="282" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="700">MCP-specific detections</text>
  <rect x="48" y="310" width="860" height="48" rx="8" fill="#1E293B" stroke="#475569"/>
  <text x="70" y="340" fill="#FCA5A5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">ERROR mcp.description-injection    Tool description instructs the LLM</text>
  <rect x="48" y="368" width="860" height="48" rx="8" fill="#1E293B" stroke="#475569"/>
  <text x="70" y="398" fill="#FCA5A5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">ERROR mcp.tool-name-spoofing       readFi1e mimics readFile</text>
  <rect x="48" y="426" width="860" height="48" rx="8" fill="#1E293B" stroke="#475569"/>
  <text x="70" y="456" fill="#FCA5A5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">ERROR mcp.shell-exec-direct        exec() reachable from tool input</text>
  <rect x="48" y="486" width="860" height="28" rx="6" fill="#052E16"/>
  <text x="70" y="506" fill="#86EFAC" font-family="Inter, ui-sans-serif, system-ui" font-size="15">Recommendation: validate tool inputs, remove imperative descriptions, use execFile with args.</text>
</svg>
