# Example reusable workflow — copy to your repo's .github/workflows/
name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: sinewaveai/agent-security-scanner-mcp/scanner-lite@main
        with:
          path: ./src
          format: text

      # Optional: upload SARIF to GitHub Security tab
